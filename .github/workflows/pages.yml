name: Deploy media to Pages

# 旧来のJekyllビルド（build_type: legacy）は "Page build failed." で落ちたため、
# GitHub Actions による静的デプロイに切り替えている。
# ここは素材を置くだけの箱なのでビルド処理は無い。そのまま publish する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
